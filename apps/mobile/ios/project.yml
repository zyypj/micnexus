# Xcode project for the iOS app, generated with XcodeGen (`xcodegen` in this
# folder), then `pod install`. The .xcodeproj is not committed.
name: MicNexus
options:
  bundleIdPrefix: app.micnexus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Release
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "100"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: NO
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_CXX_LIBRARY: libc++
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    OTHER_CPLUSPLUSFLAGS:
      - "$(OTHER_CFLAGS)"
      - "-DFOLLY_NO_CONFIG"
      - "-DFOLLY_MOBILE=1"
      - "-DFOLLY_USE_LIBCPP=1"
      - "-DFOLLY_CFG_NO_COROUTINES=1"
      - "-DFOLLY_HAVE_CLOCK_GETTIME=1"
    LIBRARY_SEARCH_PATHS:
      - "\"$(SDKROOT)/usr/lib/swift\""
      - "\"$(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME)\""
      - "\"$(inherited)\""
  configs:
    Debug:
      GCC_PREPROCESSOR_DEFINITIONS: ["DEBUG=1", "$(inherited)"]
      ONLY_ACTIVE_ARCH: YES
targets:
  MicNexus:
    type: application
    platform: iOS
    sources:
      - path: MicNexus
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: MicNexus
        PRODUCT_BUNDLE_IDENTIFIER: app.micnexus.ios
        INFOPLIST_FILE: MicNexus/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_SWIFT_FLAGS: "$(inherited) -DMICNEXUS_APP"
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC", "-lc++"]
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks"]
    dependencies:
      - target: MicNexusLiveActivity
        embed: true
    postCompileScripts:
      - name: Bundle React Native code and images
        basedOnDependencyAnalysis: false
        script: |
          set -e
          WITH_ENVIRONMENT="$REACT_NATIVE_PATH/scripts/xcode/with-environment.sh"
          REACT_NATIVE_XCODE="$REACT_NATIVE_PATH/scripts/react-native-xcode.sh"
          /bin/sh -c "\"$WITH_ENVIRONMENT\" \"$REACT_NATIVE_XCODE\""
        inputFiles:
          - $(SRCROOT)/.xcode.env.local
          - $(SRCROOT)/.xcode.env
        outputFiles:
          - $(DERIVED_FILE_DIR)/rn-bundle.stamp
    scheme: {}
  MicNexusLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: MicNexusLiveActivity
        PRODUCT_BUNDLE_IDENTIFIER: app.micnexus.ios.LiveActivity
        INFOPLIST_FILE: LiveActivity/Info.plist
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/Frameworks", "@executable_path/../../Frameworks"]
