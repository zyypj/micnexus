name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: TypeScript (typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vite build apps/desktop

  desktop:
    name: Windows app (Rust tests + installer)
    runs-on: windows-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bundled adb (USB connection)
        run: node scripts/fetch-adb.mjs
      - name: Rust fmt, clippy, tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      - name: Build installer
        run: npm run tauri --workspace @micnexus/desktop -- build
      - uses: actions/upload-artifact@v4
        with:
          name: micnexus-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  android:
    name: Android app
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - name: "Install (the Android app has its own npm project; shared packages are file links)"
        working-directory: apps/mobile
        run: npm ci
      - working-directory: apps/mobile
        run: npm run typecheck
      - working-directory: apps/mobile
        run: npx jest
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin unit tests (protocol and session)
        working-directory: apps/mobile/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Assemble APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: micnexus-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

  ios:
    name: iOS app (unsigned .ipa for Sideloadly)
    runs-on: macos-15
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - working-directory: apps/mobile
        run: npm ci
      - name: Tools
        run: brew install xcodegen
      - name: Build unsigned .ipa
        run: bash apps/mobile/scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: micnexus-ios-ipa
          path: apps/mobile/ios/build/micnexus-ios.ipa
