# Builds and publishes a release when a tag like v0.2.0 is pushed
# (create it with `node scripts/release.mjs 0.2.0`).
#
# Release assets, consumed by the auto-updaters:
#   MicNexus_<v>_x64-setup.exe (+ .sig), latest.json   -> Windows updater (tauri-plugin-updater)
#   micnexus-android.apk                               -> Android updater
#
# Secrets:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   (required, Windows updates)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD                        (recommended, Android signing)
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Version from tag must match the manifests
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/set-version.mjs "$VERSION" --check
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - id: release
        # Pre-release while building: updaters and ".../releases/latest" ignore
        # it, and unlike drafts its asset URLs already use the final tag.
        name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --prerelease --verify-tag \
            --title "MicNexus ${{ steps.v.outputs.version }}" --generate-notes
          echo "id=$(gh api "repos/${{ github.repository }}/releases/tags/$GITHUB_REF_NAME" --jq .id)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-adb.mjs
      - name: Build, sign and upload installer + latest.json
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --config src-tauri/tauri.release.conf.json
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

  android:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - run: npm ci
      - working-directory: apps/mobile
        run: npm ci
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/micnexus.keystore"
            echo "MICNEXUS_KEYSTORE=$RUNNER_TEMP/micnexus.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set: the APK is signed with the public debug key"
          fi
      - name: Assemble release APK
        working-directory: apps/mobile/android
        env:
          MICNEXUS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MICNEXUS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MICNEXUS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk micnexus-android.apk
          gh release upload "$GITHUB_REF_NAME" micnexus-android.apk --clobber

  publish:
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    steps:
      - name: Promote to latest (only now do the auto-updaters see it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" -R "${{ github.repository }}" --prerelease=false --latest
